name: Update USD Price

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Get USD price from TGJU
        id: price
        shell: bash
        run: |
          python3 <<'PY'
          import urllib.request
          import re
          import os
          from html.parser import HTMLParser

          url = "https://www.tgju.org/profile/price_dollar_rl"

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.target = False
                  self.depth = 0
                  self.value = None
                  self.text = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if not self.target and attrs.get("data-field") == "price_dollar_rl":
                      self.target = True
                      self.depth = 1
                      self.value = attrs.get("data-value")
                      return

                  if self.target:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if self.target:
                      self.depth -= 1

                      if self.depth <= 0:
                          self.target = False

              def handle_data(self, data):
                  if self.target:
                      self.text.append(data)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="ignore")

          parser = Parser()
          parser.feed(html)

          raw = parser.value or "".join(parser.text)
          digits = re.sub(r"[^0-9]", "", raw)

          if not digits:
              raise Exception("USD price was not found on TGJU")

          rial = int(digits)

          if rial < 1_000_000 or rial > 10_000_000:
              raise Exception(f"Invalid USD Rial price: {rial}")

          toman = round(rial / 10)

          print("USD Rial:", rial)
          print("USD Toman:", toman)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"toman={toman}\n")
          PY

      - name: Update prices.json
        env:
          GH_TOKEN: ${{ github.token }}
          USD_TOMAN: ${{ steps.price.outputs.toman }}
        run: |
          python3 <<'PY'
          import urllib.request
          import urllib.error
          import json
          import base64
          import os

          owner = "arhttt26"
          repo = "devil-shop"
          path = "data/prices.json"
          branch = "main"

          token = os.environ["GH_TOKEN"]
          new_price = int(os.environ["USD_TOMAN"])

          api = f"https://api.github.com/repos/{owner}/{repo}/contents/{path}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-actions"
          }

          # Get current file
          request = urllib.request.Request(
              api,
              headers=headers
          )

          with urllib.request.urlopen(request) as response:
              remote = json.load(response)

          sha = remote["sha"]

          content = base64.b64decode(
              remote["content"]
          ).decode("utf-8")

          data = json.loads(content)

          old_price = data.get("usdToman")

          print("Old USD Toman:", old_price)
          print("New USD Toman:", new_price)

          if old_price == new_price:
              print("Price has not changed.")
              exit(0)

          data["usdToman"] = new_price

          new_content = json.dumps(
              data,
              ensure_ascii=False,
              indent=2
          ) + "\n"

          encoded = base64.b64encode(
              new_content.encode("utf-8")
          ).decode("ascii")

          payload = {
              "message": f"Update USD price to {new_price}",
              "content": encoded,
              "sha": sha,
              "branch": branch
          }

          body = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              api,
              data=body,
              headers={
                  **headers,
                  "Content-Type": "application/json"
              },
              method="PUT"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)

              print("SUCCESS")
              print("Updated prices.json")
              print("Commit:", result["commit"]["sha"])

          except urllib.error.HTTPError as error:
              details = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("GitHub API ERROR:", error.code)
              print(details)

              raise
          PY
