name: Update Prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get USD price from TGJU
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          import re

          URL = "https://www.tgju.org/profile/price_dollar_rl"

          class PriceParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_target = False
                  self.depth = 0
                  self.parts = []
                  self.value_attr = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if (
                      not self.in_target
                      and attrs.get("data-field") == "price_dollar_rl"
                  ):
                      self.in_target = True
                      self.depth = 1
                      self.value_attr = attrs.get("data-value")
                      return

                  if self.in_target:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if self.in_target:
                      self.depth -= 1

                      if self.depth <= 0:
                          self.in_target = False

              def handle_data(self, data):
                  if self.in_target:
                      self.parts.append(data)

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "Chrome/140 Safari/537.36"
                  ),
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          parser = PriceParser()
          parser.feed(html)

          raw = (
              parser.value_attr
              or "".join(parser.parts)
          )

          digits = re.sub(r"[^0-9]", "", raw)

          if not digits:
              raise RuntimeError(
                  "Could not find USD price on TGJU."
              )

          usd_rial = int(digits)

          if not 1_000_000 <= usd_rial <= 10_000_000:
              raise RuntimeError(
                  f"Invalid TGJU USD Rial value: {usd_rial}"
              )

          usd_toman = round(usd_rial / 10)

          if not 100_000 <= usd_toman <= 1_000_000:
              raise RuntimeError(
                  f"Invalid USD Toman value: {usd_toman}"
              )

          print("USD Rial:", usd_rial)
          print("USD Toman:", usd_toman)

          with open(
              "/tmp/usd_toman",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(str(usd_toman))
          PY

      - name: Update prices.json
        run: |
          git fetch origin main
          git reset --hard origin/main

          USD_TOMAN=$(cat /tmp/usd_toman)

          echo "Using USD Toman: $USD_TOMAN"

          python3 - "$USD_TOMAN" <<'PY'
          import json
          import sys

          usd_toman = int(sys.argv[1])

          with open(
              "data/prices.json",
              "r",
              encoding="utf-8"
          ) as f:
              prices = json.load(f)

          prices["usdToman"] = usd_toman

          with open(
              "data/prices.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  prices,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY

          cat data/prices.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "Price has not changed."
            exit 0
          fi

          git commit -m "Update USD price"

          for attempt in 1 2 3
          do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Getting latest main..."

            git fetch origin main
            git reset --hard origin/main

            USD_TOMAN=$(cat /tmp/usd_toman)

            python3 - "$USD_TOMAN" <<'PY'
          import json
          import sys

          usd_toman = int(sys.argv[1])

          with open(
              "data/prices.json",
              "r",
              encoding="utf-8"
          ) as f:
              prices = json.load(f)

          prices["usdToman"] = usd_toman

          with open(
              "data/prices.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  prices,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY

            git add data/prices.json

            if git diff --cached --quiet; then
              echo "Price already exists in remote."
              exit 0
            fi

            git commit -m "Update USD price"
          done

          echo "Could not push after 3 attempts."
          exit 1
