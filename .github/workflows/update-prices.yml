name: Update Prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get USD price from TGJU
        run: |
          python3 - <<'PY'
          import urllib.request
          import re
          import json

          url = "https://www.tgju.org/profile/price_dollar_rl"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")

          patterns = [
              r'"price_dollar_rl".{0,1000}?"value"\s*:\s*(\d+)',
              r'data-field=["\']price_dollar_rl["\'][^>]*>.*?(\d[\d,]*)',
              r'price_dollar_rl.{0,1000}?(\d{5,})'
          ]

          value = None

          for pattern in patterns:
              match = re.search(pattern, html, re.S | re.I)
              if match:
                  raw = match.group(1).replace(",", "")
                  if raw.isdigit():
                      value = int(raw)
                      break

          if value is None:
              raise Exception("Could not find price_dollar_rl")

          usd_toman = round(value / 10)

          print("USD Rial:", value)
          print("USD Toman:", usd_toman)

          with open("data/prices.json", "r", encoding="utf-8") as f:
              prices = json.load(f)

          prices["usdToman"] = usd_toman

          with open("data/prices.json", "w", encoding="utf-8") as f:
              json.dump(prices, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit updated price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "Price has not changed."
          else
            git commit -m "Update USD price"
            git push
          fi
