name: Update Prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get USD price from TGJU
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          import re
          import json

          URL = "https://www.tgju.org/profile/price_dollar_rl"

          class PriceParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_target = False
                  self.depth = 0
                  self.parts = []
                  self.value_attr = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if (
                      not self.in_target
                      and attrs.get("data-field") == "price_dollar_rl"
                  ):
                      self.in_target = True
                      self.depth = 1
                      self.value_attr = attrs.get("data-value")
                      return

                  if self.in_target:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if self.in_target:
                      self.depth -= 1

                      if self.depth <= 0:
                          self.in_target = False

              def handle_data(self, data):
                  if self.in_target:
                      self.parts.append(data)

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "Chrome/140 Safari/537.36"
                  ),
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8",
                  "Accept": (
                      "text/html,application/xhtml+xml"
                  )
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          parser = PriceParser()
          parser.feed(html)

          raw = (
              parser.value_attr
              or "".join(parser.parts)
          )

          digits = re.sub(r"[^0-9]", "", raw)

          if not digits:
              raise RuntimeError(
                  "Could not find data-field=price_dollar_rl "
                  "in TGJU page"
              )

          value = int(digits)

          if not 1000000 <= value <= 10000000:
              raise RuntimeError(
                  f"Invalid TGJU USD Rial value: {value}"
              )

          usd_toman = round(value / 10)

          print("TGJU USD Rial:", value)
          print("USD Toman:", usd_toman)

          if not 100000 <= usd_toman <= 1000000:
              raise RuntimeError(
                  f"Invalid USD Toman value: {usd_toman}"
              )

          with open(
              "data/prices.json",
              "r",
              encoding="utf-8"
          ) as f:
              prices = json.load(f)

          prices["usdToman"] = usd_toman

          with open(
              "data/prices.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  prices,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY

      - name: Commit updated price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "Price has not changed."
          else
            git commit -m "Update USD price"

            git fetch origin main
            git rebase origin/main

            git push origin HEAD:main
          fi
