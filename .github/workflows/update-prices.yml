name: Update Prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get USD price from TGJU
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          import re

          URL = "https://www.tgju.org/profile/price_dollar_rl"

          class PriceParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_target = False
                  self.depth = 0
                  self.parts = []
                  self.value_attr = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if (
                      not self.in_target
                      and attrs.get("data-field") == "price_dollar_rl"
                  ):
                      self.in_target = True
                      self.depth = 1
                      self.value_attr = attrs.get("data-value")
                      return

                  if self.in_target:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if self.in_target:
                      self.depth -= 1

                      if self.depth <= 0:
                          self.in_target = False

              def handle_data(self, data):
                  if self.in_target:
                      self.parts.append(data)

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "Chrome/140 Safari/537.36"
                  ),
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          parser = PriceParser()
          parser.feed(html)

          raw = (
              parser.value_attr
              or "".join(parser.parts)
          )

          digits = re.sub(r"[^0-9]", "", raw)

          if not digits:
              raise RuntimeError(
                  "Could not find USD price on TGJU."
              )

          usd_rial = int(digits)

          if not 1_000_000 <= usd_rial <= 10_000_000:
              raise RuntimeError(
                  f"Invalid TGJU USD Rial value: {usd_rial}"
              )

          usd_toman = round(usd_rial / 10)

          if not 100_000 <= usd_toman <= 1_000_000:
              raise RuntimeError(
                  f"Invalid USD Toman value: {usd_toman}"
              )

          print("USD Rial:", usd_rial)
          print("USD Toman:", usd_toman)

          with open("/tmp/usd_toman", "w") as f:
              f.write(str(usd_toman))
          PY

      - name: Update prices.json through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import base64
          import urllib.request
          import urllib.error

          owner = "arhttt26"
          repo = "devil-shop"
          path = "data/prices.json"

          with open("/tmp/usd_toman", "r") as f:
              usd_toman = int(f.read().strip())

          api_url = (
              f"https://api.github.com/repos/"
              f"{owner}/{repo}/contents/{path}"
          )

          headers = {
              "Authorization": f"Bearer {__import__('os').environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-actions"
          }

          # دریافت آخرین نسخه فایل از GitHub
          req = urllib.request.Request(
              api_url,
              headers=headers
          )

          with urllib.request.urlopen(req) as response:
              remote = json.load(response)

          sha = remote["sha"]

          old_content = base64.b64decode(
              remote["content"]
          ).decode("utf-8")

          prices = json.loads(old_content)

          old_price = prices.get("usdToman")

          prices["usdToman"] = usd_toman

          new_content = json.dumps(
              prices,
              ensure_ascii=False,
              indent=2
          ) + "\n"

          if old_price == usd_toman:
              print(
                  f"USD price is already {usd_toman}. "
                  "Nothing to update."
              )
              raise SystemExit(0)

          encoded = base64.b64encode(
              new_content.encode("utf-8")
          ).decode("ascii")

          body = json.dumps({
              "message": "Update USD price",
              "content": encoded,
              "sha": sha,
              "branch": "main"
          }).encode("utf-8")

          update_request = urllib.request.Request(
              api_url,
              data=body,
              headers={
                  **headers,
                  "Content-Type": "application/json"
              },
              method="PUT"
          )

          try:
              with urllib.request.urlopen(
                  update_request
              ) as response:
                  result = json.load(response)

              print("prices.json updated successfully.")
              print("New USD Toman:", usd_toman)
              print("Commit:", result["commit"]["sha"])

          except urllib.error.HTTPError as e:
              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              raise RuntimeError(
                  f"GitHub API error {e.code}: {error_body}"
              )
          PY
