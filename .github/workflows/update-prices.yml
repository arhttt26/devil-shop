name: Update Prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get USD price from TGJU
        run: |
          python3 - <<'PY'
          import urllib.request
          import re
          import json

          url = "https://www.tgju.org/profile/price_dollar_rl"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", errors="ignore")

          value = None

          # روش اصلی:
          # پیدا کردن المان مربوط به price_dollar_rl
          patterns = [
              r'data-field=["\']price_dollar_rl["\'][^>]*>.*?<[^>]*>([\d,]+)<',
              r'data-field=["\']price_dollar_rl["\'][^>]*data-value=["\'](\d+)',
              r'data-field=["\']price_dollar_rl["\'][^>]*>[^0-9]*([\d,]{6,})',
          ]

          for pattern in patterns:
              match = re.search(pattern, html, re.S | re.I)

              if match:
                  raw = match.group(1).replace(",", "").strip()

                  if raw.isdigit():
                      candidate = int(raw)

                      # دلار TGJU در حال حاضر در محدوده صدها هزار تا چند میلیون ریال است.
                      # این شرط از گرفتن اعداد نامرتبط صفحه جلوگیری می‌کند.
                      if 100000 <= candidate <= 10000000:
                          value = candidate
                          break

          # روش پشتیبان:
          # اگر ساختار HTML تغییر کرده باشد، عبارت price_dollar_rl
          # و نزدیک‌ترین عدد معتبر را پیدا می‌کنیم.
          if value is None:
              matches = re.finditer(
                  r'price_dollar_rl.{0,3000}?([\d,]{6,})',
                  html,
                  re.S | re.I
              )

              for match in matches:
                  raw = match.group(1).replace(",", "").strip()

                  if raw.isdigit():
                      candidate = int(raw)

                      if 100000 <= candidate <= 10000000:
                          value = candidate
                          break

          if value is None:
              raise Exception(
                  "Could not find a valid price for price_dollar_rl on TGJU"
              )

          # TGJU قیمت دلار را به ریال اعلام می‌کند.
          # تبدیل ریال به تومان:
          usd_toman = round(value / 10)

          print("TGJU USD Rial:", value)
          print("USD Toman:", usd_toman)

          # بررسی منطقی برای جلوگیری از ثبت مقدار خراب
          if usd_toman < 10000 or usd_toman > 1000000:
              raise Exception(
                  f"Invalid USD Toman value detected: {usd_toman}"
              )

          with open("data/prices.json", "r", encoding="utf-8") as f:
              prices = json.load(f)

          prices["usdToman"] = usd_toman

          with open("data/prices.json", "w", encoding="utf-8") as f:
              json.dump(
                  prices,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY

      - name: Commit updated price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "Price has not changed."
          else
            git commit -m "Update USD price"
            git push
          fi
