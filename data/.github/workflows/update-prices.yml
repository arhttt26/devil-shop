name: Update shop prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update prices.json
        env:
          TGJU_API_URL: https://raw.githubusercontent.com/amiranmanesh/tgju-api-go/main/examples/README.md
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("data/prices.json")
          old = json.loads(path.read_text(encoding="utf-8"))

          usd_toman = float(old.get("usdToman", 0) or 0)

          if usd_toman <= 0:
              raise SystemExit(
                  "usdToman is not configured. Set a real exchange-rate API/source first."
              )

          old["usdToman"] = round(usd_toman, 2)
          old["updatedAt"] = datetime.now(timezone.utc).isoformat()

          path.write_text(
              json.dumps(old, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json

          if git diff --cached --quiet; then
            echo "No price changes."
            exit 0
          fi

          git commit -m "Update shop prices"
          git push
